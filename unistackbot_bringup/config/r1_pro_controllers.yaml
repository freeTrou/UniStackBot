# r1_pro 控制器配置 (2026-10-14 首接入; 四件式: js_arms + js_torso + cm, 底盘生态件后续)
# 分割依据: docs/guides/robot_import_sop.md S1 解剖报告 + 四件式裁决 (mobile_manipulator 首例)
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    thread_priority: 80
    cpu_affinity: 1
    lock_memory: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    js_arms:
      type: unistackbot_controller/JointStreamController

    js_torso:
      type: unistackbot_controller/JointStreamController

    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController

    ee_state_broadcaster:
      type: unistackbot_controller/EeStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**:
  ros__parameters: {} # 逐控制器段见下

joint_state_broadcaster:
  ros__parameters: {}

js_arms:
  ros__parameters:
    interpolation: ruckig
    observe_applied_command: false

js_torso:
  ros__parameters:
    interpolation: ruckig
    observe_applied_command: false

ee_state_broadcaster:
  ros__parameters:
    base_link: base_link
    tip_link: left_arm_link6      # 主臂 = 左臂 (单 CM 裁决; 右臂走 JS)
    publish_hz: 50.0

cartesian_motion_controller:
  ros__parameters:
    base_link: base_link
    tip_link: left_arm_link6
    ik_solver: trac_ik            # 7-DoF 单臂链数值解; message_rate 必配 (2026-10-12 卡顿根因)
    ik_timeout_ms: 50.0
    ik_timeout_mode: message_rate
    max_acceleration: 5.0
    max_jerk: 20.0
