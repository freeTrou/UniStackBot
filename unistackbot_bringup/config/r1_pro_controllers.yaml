# r1_pro 控制器配置 (官方 2026 g1z 提取 2026-10-14; 四件式: js_arms+js_torso+cm)
# /** 通配节 = 控制器节点的 update_rate 权威定源 (缺它 JS/CM 落激活窗口中位数兜底,
# CM 的中位数会被激活瞬间 µs period 污染 → OTG 时间尺度错 → 臂以龟速爬; 2026-10-15 实锤)
/**:
  ros__parameters:
    update_rate: 500

controller_manager:
  ros__parameters:
    update_rate: 500
    thread_priority: 80
    cpu_affinity: 1
    lock_memory: true
    joint_state_broadcaster:
      type: unistackbot_controller/UniJointStateBroadcaster
    js_arms:
      type: unistackbot_controller/JointStreamController
    js_torso:
      type: unistackbot_controller/JointStreamController
    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController
    ee_state_broadcaster:
      type: unistackbot_controller/EeStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    base_velocity_controller:
      type: unistackbot_controller/BaseVelocityController

js_arms:
  ros__parameters:
    joints: [left_arm_joint1, left_arm_joint2, left_arm_joint3, left_arm_joint4,
             left_arm_joint5, left_arm_joint6, left_arm_joint7,
             right_arm_joint1, right_arm_joint2, right_arm_joint3, right_arm_joint4,
             right_arm_joint5, right_arm_joint6, right_arm_joint7]
    interpolation: ruckig
    observe_applied_command: false

js_torso:
  ros__parameters:
    joints: [torso_joint1, torso_joint2, torso_joint3, torso_joint4]
    interpolation: ruckig
    observe_applied_command: false

# MoveIt 执行器 (inactive 常驻; mock 链 spawner 拉起, Humble 须 spawner -t 传 type)
joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [left_arm_joint1, left_arm_joint2, left_arm_joint3, left_arm_joint4,
             left_arm_joint5, left_arm_joint6, left_arm_joint7,
             right_arm_joint1, right_arm_joint2, right_arm_joint3, right_arm_joint4,
             right_arm_joint5, right_arm_joint6, right_arm_joint7,
             torso_joint1, torso_joint2, torso_joint3, torso_joint4]
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

ee_state_broadcaster:
  ros__parameters:
    base_link: base_link
    tip_link: left_arm_link7
    publish_hz: 50.0

# 底盘域 (2026-10-15 B2): 三舵轮, steer=position + wheel=velocity; steer 不在
# js_arms/js_torso 的 joints 列表 = 无人认领 = 底盘控制器独占 (单块化编组红利)
base_velocity_controller:
  ros__parameters:
    base_kinematics: n_steer
    kinematics_joints: [steer_motor_joint1, wheel_motor_joint1,
                        steer_motor_joint2, wheel_motor_joint2,
                        steer_motor_joint3, wheel_motor_joint3]
    kinematics_params: [0.0765,                       # 轮半径 m
                        0.0, 0.0, 0.0,                # 转向零位偏置×3
                        0.16897, 0.16897, -0.32703,   # 安装位 x (转向轴, base 系)
                        0.28, -0.28, 0.0]             # 安装位 y
    cmd_timeout: 0.5
    max_lin_x: 1.0
    max_lin_y: 1.0
    max_ang: 1.0
    max_lin_accel: 1.0
    max_lin_jerk: 5.0
    max_ang_accel: 3.0
    max_ang_jerk: 15.0
    publish_hz: 50.0

cartesian_motion_controller:
  ros__parameters:
    base_link: base_link
    tip_link: left_arm_link7
    ik_solver: trac_ik
    ik_timeout_ms: 50.0
    ik_timeout_mode: message_rate
    max_acceleration: 5.0
    max_jerk: 20.0
