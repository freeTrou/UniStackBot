# arm7_test 机型验收登记表 —— 测试判据登记值单一事实源 (verify_robot.sh 消费)
# 定义依据: docs/sim/sim_validation_pipeline.md; 建表同 r1_7a_acceptance.yaml 型
# 纪律: 改模型/改判据阈值 → 先改这里 (登记值变更要说明理由), verify 按此断言
fingerprint:                # 静态判据
  subchain_count: 10        # 判据②: link 子链数 (world + bench + base_link + link1-7; bench 台架多占一)
  joints_by_chain:          # 判据③: 各形态命令关节集 (顺序=URDF <ros2_control> 序)
    mock:   [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    ign:    [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    mujoco: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
  plugins:               # 判据③½: per-chain 硬件插件名
    mock: unistackbot_sim_control/SimControlHardware
    ign: gz_ros2_control/GazeboSimSystem
    mujoco: mujoco_ros2_control/MujocoSystemInterface   # 挂账: MJCF 未生成, mujoco 链未开
tolerance:                  # 测试容差登记 (初始=r1_7a 同款口径)
  js_mock: 0.01
  cm_mock: 0.002
  js_gz: 0.05
  cm_gz: 0.005
  js_mujoco: 0.02
  cm_mujoco: 0.003
mimic:                      # 无夹爪无 mimic
  pairs: ""
soft_joints:                # 已知回归不计失败
  gz: ""
