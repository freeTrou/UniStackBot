/**:
  ros__parameters:
    update_rate: 500

controller_manager:
  ros__parameters:
    thread_priority: 80
    cpu_affinity: 1
    lock_memory: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_stream_controller:
      type: unistackbot_controller/JointStreamController
    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController
    ee_state_broadcaster:
      type: unistackbot_controller/EeStateBroadcaster

joint_stream_controller:
  ros__parameters:
    interpolation: ruckig
    max_acceleration: 5.0
    max_jerk: 20.0
    # 断流语义 (2026-10-09 用户裁决): 不主动刹停, 收敛到最后收到的点保持
    # —— 0c 受控减速退役; 下方两行留档
    # stale_timeout_ms: 200.0
    # stale_decel_ms: 200.0
    observe_applied_command: true   # 观测面: ~/applied_command 500Hz 插值后命令 (录包三层对账)

cartesian_motion_controller:
  ros__parameters:
    base_link: left_armbase
    tip_link: left_linkgripper
    ik_solver: trac_ik   # 数值解默认 trac_ik (2026-10-08 全机型换装; DlsIk=RT 场景/离线调试 fallback)
    ik_timeout_ms: 50.0
    max_acceleration: 5.0
    max_jerk: 20.0

ee_state_broadcaster:
  ros__parameters:
    base_link: left_armbase
    tip_link: left_linkgripper
    publish_hz: 50.0

# MoveIt 执行控制器 (M1): inactive 常驻注册, 执行窗口切 JS↔JTC。
# 任务域断流语义 = 停在最后一点 (JTC 原生, 主流做法)。
joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
