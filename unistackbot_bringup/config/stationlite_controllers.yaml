/**:
  ros__parameters:
    update_rate: 500

controller_manager:
  ros__parameters:
    thread_priority: 80
    cpu_affinity: 1
    lock_memory: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_stream_controller:
      type: unistackbot_controller/JointStreamController
    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController
    ee_state_broadcaster:
      type: unistackbot_controller/EeStateBroadcaster

joint_stream_controller:
  ros__parameters:
    interpolation: ruckig
    max_acceleration: 5.0
    max_jerk: 20.0
    stale_timeout_ms: 200.0
    stale_decel_ms: 200.0
    observe_applied_command: true   # 观测面: ~/applied_command 500Hz 插值后命令 (录包三层对账)

cartesian_motion_controller:
  ros__parameters:
    base_link: left_armbase
    tip_link: left_linkgripper
    ik_solver: dls
    ik_timeout_ms: 50.0
    max_acceleration: 5.0
    max_jerk: 20.0

ee_state_broadcaster:
  ros__parameters:
    base_link: left_armbase
    tip_link: left_linkgripper
    publish_hz: 50.0
