/**:
  ros__parameters:
    update_rate: 500

controller_manager:
  ros__parameters:
    thread_priority: 80
    cpu_affinity: 1
    lock_memory: true

    joint_state_broadcaster:
      type: unistackbot_controller/UniJointStateBroadcaster
    joint_stream_controller:
      type: unistackbot_controller/JointStreamController
    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController
    ee_state_broadcaster:
      type: unistackbot_controller/EeStateBroadcaster

joint_stream_controller:
  ros__parameters:
    interpolation: ruckig
    max_acceleration: 5.0
    max_jerk: 20.0
    observe_applied_command: true   # 录制规范 v1 必录: 意图(command)→执行(applied)跟踪账
    # 断流语义 (2026-10-10 统一, 无参数无机制): ~/command 停发 = 最后一帧即当前
    # 目标, 总线节拍照常下发, 臂收敛到它保持

# 7 轴冗余 → trac_ik (仓内数值解既定裁决; 解析解评估档案见 arms/arm7_test/README.md:
# 准 S-R-S 带肩偏置 27.5mm, 锁 J4 降 6 轴走 IKFast 为可选后手)
cartesian_motion_controller:
  ros__parameters:
    base_link: base_link
    tip_link: link7        # 临时=链尾 (腕中心); 法兰定义到位后换 —— 与 xarm7/r1_7a/r1_pro 同姿势
    ik_solver: trac_ik
    ik_timeout_ms: 50.0
    ik_timeout_mode: message_rate   # 流式预算自适应 (trac_ik Distance 每条烧满定额)
    max_acceleration: 5.0   # OTG 资产暂用通用值 (r1_7a 同款); 机型真值随机型规格书补
    max_jerk: 20.0

ee_state_broadcaster:
  ros__parameters:
    base_link: base_link
    tip_link: link7
    publish_hz: 50.0

# MoveIt 执行控制器: inactive 常驻注册 (机型进 MoveIt 时启用)
joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
