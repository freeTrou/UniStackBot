controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    cartesian_motion_controller:
      type: unistackbot_controller/CartesianMotionController

cartesian_motion_controller:
  ros__parameters:
    base_link: base_link
    tip_link: link6
    # piper 暂无种子库资产, relpath 留空 = 走分支+随机阶梯
    seed_library_package: unistackbot_description
    seed_library_relpath: ""
    update_timeout_ns: 500000
    cold_timeout_ns: 50000000
    max_cart_step: 0.02
    degraded_n: 50

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
